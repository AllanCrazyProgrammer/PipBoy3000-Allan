# PIP-BOY 3000 — Android build
#
# Manual-only trigger (workflow_dispatch). This workflow is never run on push,
# pull request, or schedule; you start it by hand from the Actions tab.
#
# Signing keys are never committed to this public repository. Debug builds use
# the runner's temporary debug key; official update APKs are signed separately.
#
# Re-index trigger: this workflow is registered by GitHub when a commit lands on
# the default branch after Actions is enabled.
name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to assemble"
        type: choice
        default: debug
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the built-in GITHUB_TOKEN can create a Release and upload the APK.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # NO usar android-actions/setup-android@v3: corre `sdkmanager tools`
      # y Google ya quitó el paquete `tools` ("Failed to find package
      # 'tools'", exit code 1). Lo mismo tumbó el workflow de rey-pez-app
      # el 2026-11-12. El runner ubuntu-latest ya trae el SDK preinstalado
      # en /usr/local/lib/android/sdk; aquí solo se expone en PATH y se
      # instalan las piezas que el build necesita.
      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          TOOLS=$(ls -d $SDK/cmdline-tools/* | sort -V | tail -1)
          echo "$TOOLS/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          yes | "$TOOLS/bin/sdkmanager" --licenses > /dev/null || true
          "$TOOLS/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # La app (v1.4.0) lee versionName/versionCode del cuerpo del Release
      # para saber si hay actualización. Se leen de build.gradle.kts.
      - name: Read app version
        id: app_version
        run: |
          echo "version_name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\"/\1/')" >> $GITHUB_OUTPUT
          echo "version_code=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')" >> $GITHUB_OUTPUT

      - name: Assemble ${{ inputs.build_type }} APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipboy3000-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

      # Publish the APK to the repository's Releases page (one release per run).
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PIP-BOY 3000 v${{ steps.app_version.outputs.version_name }} — ${{ inputs.build_type }} build #${{ github.run_number }}
          body: |
            Automated ${{ inputs.build_type }} build of PIP-BOY 3000.

            - Commit: ${{ github.sha }}
            - versionName: ${{ steps.app_version.outputs.version_name }}
            - versionCode: ${{ steps.app_version.outputs.version_code }}
            - CI build for testing; official update APKs are signed separately.
            - Install with: `adb install <apk>`
          files: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          fail_on_unmatched_files: true
