# PIP-BOY 3000 — Android build
#
# Manual-only trigger (workflow_dispatch). This workflow is never run on push,
# pull request, or schedule; you start it by hand from the Actions tab.
#
# Signing keys are never committed to this public repository. Debug builds use
# the runner's temporary debug key; official update APKs are signed separately.
#
# Re-index trigger: this workflow is registered by GitHub when a commit lands on
# the default branch after Actions is enabled.
name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to assemble"
        type: choice
        default: debug
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the built-in GITHUB_TOKEN can create a Release and upload the APK.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (native PTY for the terminal)
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble ${{ inputs.build_type }} APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipboy3000-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

      # Publish the APK to the repository's Releases page (one release per run).
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PIP-BOY 3000 — ${{ inputs.build_type }} build #${{ github.run_number }}
          body: |
            Automated ${{ inputs.build_type }} build of PIP-BOY 3000.

            - Commit: ${{ github.sha }}
            - CI build for testing; official update APKs are signed separately.
            - Install with: `adb install <apk>`
          files: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          fail_on_unmatched_files: true
